# Gallery screenshots with a real renderer (software Vulkan / GL under Xvfb): PRESENTATION_CONTRACTS §10.
name: Shots

# Builds only for pushes to main (and the manual "Run workflow" button), not every branch push.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
      - name: Software renderers
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-vulkan-drivers libgl1-mesa-dri
      - name: Import
        run: godot --headless --path . --editor --import --quit
      - name: Galleries (Forward+ and Compatibility)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" godot --path . --audio-driver Dummy --resolution 1600x900 -s scripts/shots/galleries.gd
          xvfb-run -a -s "-screen 0 1920x1080x24" godot --path . --audio-driver Dummy --rendering-method gl_compatibility --resolution 1600x900 -s scripts/shots/galleries.gd
          ls build/shots/v*/en
          test "$(ls build/shots/v*/en/*.png | wc -l)" -ge 22
      - name: Tour (the real game, driven by input, en and es)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          for lang in en es; do
            xvfb-run -a -s "-screen 0 1920x1080x24" godot --path . --audio-driver Dummy --resolution 1600x900 -s scripts/shots/tour.gd -- lang=$lang
            test "$(ls build/shots/v*/$lang/0*.png | wc -l)" -ge 6
          done
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: build/shots/
          if-no-files-found: error
          retention-days: 14
