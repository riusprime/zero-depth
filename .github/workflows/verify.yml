# Adapted from riusprime/deathventory@1d697803:.github/workflows/verify.yml.
# Steps and the step each goes live in: docs/roadmap/v0.0.1/PLAN.md Step 3.
name: Verify

# Owner, 2026-10-08: "why would be doing the same thing 3 times after it already turned green once". GitHub tests
# only the PR into main (its merge result is what lands on main), plus a manual "Run workflow" button.
# Owner, 2026-10-13 (the full run "takes a lot of time"): this is the one full suite of a version (CLAUDE.md "Testing
# before a push"), run as parallel shards (scripts/ci/gut_shard.sh); the job named `verify` passes only when every
# shard and every check passed and the shards' passing tests reach tests/MIN_TEST_COUNT.
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  # v0.11.1 Step 4 (owner L8): the full suite runs every seed loop at its full 1,000 (tests/support/seeds.gd)
  ZD_FULL_SEEDS: "1"

jobs:
  # v0.11.1 Step 9: lint runs first, so a format error stops the run before any shard starts. The assets are
  # imported once here and cached; the checks job and the six shards restore them instead of importing cold.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GUT version is pinned
        run: grep -q 'version="9.7.1"' addons/gut/plugin.cfg

      - name: Every test file is in exactly one shard
        run: bash scripts/ci/gut_shard.sh --check

      - name: Lint and format
        run: |
          pip install -r requirements-dev.txt
          gdformat --check src scripts tests
          gdlint src scripts tests

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Godot version is pinned
        run: |
          godot --version
          godot --version | grep -q "^${GODOT_VERSION}.stable"

      - name: Cache the imported assets
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/uid_cache.bin
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('assets/**', '**/*.import', 'project.godot') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-

      # The native library (native/README.md), built once here for the gut shards. Saved only when it built and
      # loaded: a failed build leaves nothing to save, the shards run without it (its tests pending), and `verify`
      # turns red on the `native` output below instead of every shard failing.
      - name: Restore the native library built from these exact sources
        id: native-bin
        uses: actions/cache@v4
        with:
          path: |
            native/bin
            native/zd_native.gdextension
          key: native-linux-${{ hashFiles('native/GODOT_CPP_COMMIT', 'native/api/extension_api.json', 'native/SConstruct', 'native/zd_native.gdextension.in', 'native/src/**', 'scripts/native/*.sh') }}

      - name: Cache the compiled bindings (SCONS_CACHE)
        if: steps.native-bin.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/zero-depth/scons
          key: native-scons-linux-${{ hashFiles('native/GODOT_CPP_COMMIT', 'native/api/extension_api.json') }}-${{ hashFiles('native/src/**', 'native/SConstruct') }}
          restore-keys: native-scons-linux-${{ hashFiles('native/GODOT_CPP_COMMIT', 'native/api/extension_api.json') }}-

      - name: Build the native library (Linux, gcc) and check that it loads
        id: native
        if: steps.native-bin.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          pip install -r native/requirements.txt
          bash scripts/ci/native_lib.sh debug

      - name: Import (fails on import errors)
        run: |
          mkdir -p build
          godot --headless --path . --editor --import --quit 2>&1 | tee build/import.log || true
          if sed -E 's/\x1B\[[0-9;]*[mK]//g' build/import.log | grep -E -q "^(ERROR|SCRIPT ERROR)"; then
            echo "Import reported errors"; exit 1
          fi

      - name: Upload the native build log on failure
        if: steps.native.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: native-build-logs
          path: |
            build/native_build.log
            build/native_import.log

    outputs:
      # success: built now; skipped: restored from the cache (built and loaded on an earlier run); failure: not built
      native: ${{ steps.native.outcome }}

  # The checks job runs without the native library: the native switch is off by default, so none of its checks
  # reaches it, and its export of the Windows preset would look for a Windows library this Linux job never builds.
  checks:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Restore the imported assets (saved by the prepare job)
        uses: actions/cache/restore@v4
        with:
          path: |
            .godot/imported
            .godot/uid_cache.bin
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('assets/**', '**/*.import', 'project.godot') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-

      - name: Import (fails on import errors)
        run: |
          mkdir -p build
          godot --headless --path . --editor --import --quit 2>&1 | tee build/import.log || true
          if sed -E 's/\x1B\[[0-9;]*[mK]//g' build/import.log | grep -E -q "^(ERROR|SCRIPT ERROR)"; then
            echo "Import reported errors"; exit 1
          fi

      - name: Hitch probe (real time, no --fixed-fps)
        run: godot --headless --path . -s scripts/checks/hitch_probe.gd

      - name: Kernel smoke (20 seeds, run twice, must be identical)
        run: |
          godot --headless --path . -s scripts/sim/kernel_smoke.gd -- seeds=1..20 out=build/smoke_a.jsonl
          godot --headless --path . -s scripts/sim/kernel_smoke.gd -- seeds=1..20 out=build/smoke_b.jsonl
          diff build/smoke_a.jsonl build/smoke_b.jsonl
          grep -h '"seed":1}' build/smoke_a.jsonl

      - name: Bench (informational, never fails the job)
        continue-on-error: true
        run: godot --headless --path . -s scripts/bench/sim_bench.gd

      - name: Export pack and smoke inside it
        run: bash scripts/ci/export_smoke.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: checks-logs
          path: |
            build/*.log
            build/check/*.log
            build/*.jsonl

  gut:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [ sim_a, sim_b, sim_c, e2e, presentation, rest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Restore the imported assets (saved by the prepare job)
        uses: actions/cache/restore@v4
        with:
          path: |
            .godot/imported
            .godot/uid_cache.bin
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('assets/**', '**/*.import', 'project.godot') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-

      - name: Restore the native library (saved by the prepare job)
        id: native-bin
        uses: actions/cache/restore@v4
        with:
          path: |
            native/bin
            native/zd_native.gdextension
          key: native-linux-${{ hashFiles('native/GODOT_CPP_COMMIT', 'native/api/extension_api.json', 'native/SConstruct', 'native/zd_native.gdextension.in', 'native/src/**', 'scripts/native/*.sh') }}

      - name: Import (fails on import errors)
        run: |
          mkdir -p build
          godot --headless --path . --editor --import --quit 2>&1 | tee build/import.log || true
          if sed -E 's/\x1B\[[0-9;]*[mK]//g' build/import.log | grep -E -q "^(ERROR|SCRIPT ERROR)"; then
            echo "Import reported errors"; exit 1
          fi

      - name: GUT shard ${{ matrix.shard }}
        # With the library restored, its tests must find it loaded (tests/unit/app/test_native_move.gd)
        env:
          ZD_NATIVE_REQUIRED: ${{ steps.native-bin.outputs.cache-hit == 'true' && '1' || '' }}
        run: bash scripts/ci/gut_shard.sh ${{ matrix.shard }}

      - name: Upload the shard's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: gut-${{ matrix.shard }}
          path: |
            build/gut_${{ matrix.shard }}.log
            build/gut_${{ matrix.shard }}.xml

  verify:
    runs-on: ubuntu-latest
    needs: [ prepare, checks, gut ]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Every job passed
        run: |
          echo "prepare: ${{ needs.prepare.result }}, checks: ${{ needs.checks.result }}, gut: ${{ needs.gut.result }}"
          [ "${{ needs.prepare.result }}" = "success" ]
          [ "${{ needs.checks.result }}" = "success" ]
          [ "${{ needs.gut.result }}" = "success" ]

      - name: The native library built (or was restored from an earlier build)
        run: |
          echo "native: ${{ needs.prepare.outputs.native }}"
          [ "${{ needs.prepare.outputs.native }}" != "failure" ] || {
            echo "The native library did not build or load: the shards ran without it (see native-build-logs)"; exit 1; }

      - name: Download the shard logs
        uses: actions/download-artifact@v4
        with:
          pattern: gut-*
          path: build/shards

      - name: The shards together reach tests/MIN_TEST_COUNT
        run: bash scripts/ci/check_gut_total.sh build/shards/gut-*/gut_*.log
